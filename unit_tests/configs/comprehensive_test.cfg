# Comprehensive test file demonstrating all cfgscript features

# ============ 1. Basic macros and string substitution ============
%define APP_NAME MyApplication
%define VERSION 2.1.0
%define AUTHOR JohnDoe

app.name = ${APP_NAME}
app.version = ${VERSION}
app.author = ${AUTHOR}

# ============ 2. Numeric expressions and calculations ============
%define BASE_PORT 8000
%define PORT_OFFSET 100
%set CALCULATED_PORT ${BASE_PORT} + ${PORT_OFFSET}
%set MAX_CONNECTIONS 50 * 2
%set TIMEOUT_MS 30 * 1000

server.port = ${CALCULATED_PORT}
server.max_connections = ${MAX_CONNECTIONS}
server.timeout_ms = ${TIMEOUT_MS}

# ============ 3. Conditional compilation with %if/%elif/%else ============
%define ENVIRONMENT production

%if ${ENVIRONMENT} == "development"
  app.debug = true
  app.log_level = debug
  database.pool_size = 5
%elif ${ENVIRONMENT} == "staging"
  app.debug = false
  app.log_level = info
  database.pool_size = 10
%elif ${ENVIRONMENT} == "production"
  app.debug = false
  app.log_level = warning
  database.pool_size = 50
%else
  app.debug = false
  app.log_level = error
  database.pool_size = 20
%endif

# ============ 4. Boolean expressions ============
%set ENABLE_CACHE 1
%set ENABLE_COMPRESSION 1
%set USE_HTTPS 1

%if ${ENABLE_CACHE} && ${ENABLE_COMPRESSION}
  cache.enabled = true
  cache.compression = true
%endif

%if ${USE_HTTPS}
  security.protocol = https
  security.port = 443
%else
  security.protocol = http
  security.port = 80
%endif

# ============ 5. Loops with numeric ranges ============
%for NODE_ID in 1..5
  node.${NODE_ID}.hostname = server${NODE_ID}.example.com
  node.${NODE_ID}.port = ${BASE_PORT}
  node.${NODE_ID}.enabled = true
%endfor

# ============ 6. Loops with lists ============
%for REGION in us-east,us-west,eu-central,ap-south
  region.${REGION}.available = yes
  region.${REGION}.backup = enabled
%endfor

# ============ 7. Nested loops ============
%for CLUSTER_ID in 1..3
  %for SHARD_ID in 1..2
    cluster.${CLUSTER_ID}.shard.${SHARD_ID}.replicas = 3
    cluster.${CLUSTER_ID}.shard.${SHARD_ID}.priority = high
  %endfor
%endfor

# ============ 8. Complex expressions with arithmetic ============
%set MEMORY_GB 16
%set MEMORY_MB ${MEMORY_GB} * 1024
%set CACHE_SIZE ${MEMORY_MB} / 4

memory.total_gb = ${MEMORY_GB}
memory.total_mb = ${MEMORY_MB}
cache.size_mb = ${CACHE_SIZE}

# ============ 9. Nested conditionals ============
%define FEATURE_X enabled
%define FEATURE_Y disabled

%if ${FEATURE_X} == "enabled"
  feature.x.active = true
  %if ${FEATURE_Y} == "enabled"
    feature.xy.mode = both
  %else
    feature.xy.mode = x_only
  %endif
%endif

# ============ 10. Combined conditions and expressions ============
%set LOAD_FACTOR 75
%if ${LOAD_FACTOR} > 70
  alert.high_load = true
  %set SCALE_FACTOR 2
  scaling.factor = ${SCALE_FACTOR}
%elif ${LOAD_FACTOR} > 50
  alert.medium_load = true
  %set SCALE_FACTOR 1
  scaling.factor = ${SCALE_FACTOR}
%else
  alert.low_load = true
  scaling.factor = 1
%endif

# ============ 11. String comparisons ============
%define DATABASE_TYPE postgresql

%if ${DATABASE_TYPE} == "mysql"
  db.driver = com.mysql.jdbc.Driver
  db.default_port = 3306
%elif ${DATABASE_TYPE} == "postgresql"
  db.driver = org.postgresql.Driver
  db.default_port = 5432
%elif ${DATABASE_TYPE} == "mongodb"
  db.driver = mongodb.driver
  db.default_port = 27017
%endif

# ============ 12. Loop with conditional inside ============
%for WORKER_ID in 1..4
  worker.${WORKER_ID}.name = worker-${WORKER_ID}
  %if ${WORKER_ID} <= 2
    worker.${WORKER_ID}.role = primary
    worker.${WORKER_ID}.priority = high
  %else
    worker.${WORKER_ID}.role = secondary
    worker.${WORKER_ID}.priority = normal
  %endif
%endfor

# ============ 13. Complex numeric expressions ============
%set RESULT (10 + 5) * 3 - 8 / 2
%set COMPARISON ${RESULT} >= 40

calculation.result = ${RESULT}
calculation.passes = ${COMPARISON}

# ============ 14. Final summary values ============
%set TOTAL_NODES 5
%set TOTAL_REGIONS 4
%set TOTAL_CLUSTERS 3
%set TOTAL_SHARDS 2
%set TOTAL_WORKERS 4
%set TOTAL_RESOURCES ${TOTAL_NODES} + ${TOTAL_REGIONS} + ${TOTAL_CLUSTERS} + ${TOTAL_WORKERS}

summary.nodes = ${TOTAL_NODES}
summary.regions = ${TOTAL_REGIONS}
summary.clusters = ${TOTAL_CLUSTERS}
summary.shards_per_cluster = ${TOTAL_SHARDS}
summary.workers = ${TOTAL_WORKERS}
summary.total_resources = ${TOTAL_RESOURCES}
